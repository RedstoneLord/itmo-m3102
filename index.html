/* ---------- notes parser (markdown + callouts + code + LaTeX) ---------- */
const CALLOUT_TYPES={
  remember:{color:'#e0485c',bg:'rgba(224,72,92,.08)',icon:'🔴',label:'Запомнить'},
  note:{color:'#dd9a2b',bg:'rgba(221,154,43,.08)',icon:'🟡',label:'Заметка'},
  meaning:{color:'#3b82f6',bg:'rgba(59,130,246,.08)',icon:'🔵',label:'Определение'},
  warning:{color:'#f97316',bg:'rgba(249,115,22,.08)',icon:'🟠',label:'Важно'},
  example:{color:'#22c55e',bg:'rgba(34,197,94,.08)',icon:'🟢',label:'Пример'},
  formula:{color:'#a855f7',bg:'rgba(168,85,247,.08)',icon:'🟣',label:'Формула'}
};
const CALLOUT_ALIASES={remember:'remember',запомнить:'remember',note:'note',заметка:'note',meaning:'meaning',определение:'meaning',warning:'warning',важно:'warning',внимание:'warning',example:'example',пример:'example',formula:'formula',формула:'formula'};
function resolveCalloutType(raw){return CALLOUT_ALIASES[String(raw).toLowerCase()]||'note';}

const calloutExtension={
  name:'callout', level:'block',
  start(src){const m=/(^|\n):::\S+/.exec(src);return m?m.index+(m[1]?1:0):undefined;},
  tokenizer(src){
    const rule=/^:::(\S+)[ \t]*\n([\s\S]*?)\n:::[ \t]*(?:\n|$)/;
    const m=rule.exec(src);
    if(m){
      const token={type:'callout',raw:m[0],calloutType:m[1],text:m[2],tokens:[]};
      this.lexer.blockTokens(token.text,token.tokens);
      return token;
    }
  },
  renderer(token){
    const type=resolveCalloutType(token.calloutType), cfg=CALLOUT_TYPES[type];
    return `<div class="callout" style="--c-color:${cfg.color};--c-bg:${cfg.bg};"><div class="callout-title">${cfg.icon} ${cfg.label}</div><div class="callout-body">${this.parser.parse(token.tokens)}</div></div>\n`;
  }
};
marked.use({
  gfm:true, breaks:false,
  extensions:[calloutExtension],
  renderer:{
    code(code,infostring){
      const lang=(infostring||'').trim().split(/\s+/)[0];
      let out;
      try{out=(lang&&hljs.getLanguage(lang))?hljs.highlight(code,{language:lang}).value:hljs.highlightAuto(code).value;}
      catch(e){out=esc(code);}
      return `<pre><code class="hljs">${out}</code></pre>`;
    }
  }
});

function renderNotes(raw) {
  const codeStore = [];

  // Сначала защищаем fenced code
  let text = raw.replace(/```[\s\S]*?```/g, m => {
    codeStore.push(m);
    return `@@CODE_${codeStore.length - 1}@@`;
  });

  const mathStore = [];

  function stash(src, display) {
    mathStore.push({ src, display });
    return `@@MATH_${mathStore.length - 1}@@`;
  }

  // Защищаем математику от Markdown-парсера
  text = text.replace(/\$\$([\s\S]+?)\$\$/g, (_, g) =>
    stash(g.trim(), true)
  );

  text = text.replace(/\\\[([\s\S]+?)\\\]/g, (_, g) =>
    stash(g.trim(), true)
  );

  text = text.replace(/\\\(([\s\S]+?)\\\)/g, (_, g) =>
    stash(g.trim(), false)
  );

  text = text.replace(/\$([^\$\n]+?)\$/g, (_, g) =>
    stash(g.trim(), false)
  );

  // Теперь Markdown
  let html = marked.parse(text);

  // Возвращаем формулы
  html = html.replace(/@@MATH_(\d+)@@/g, (_, i) => {
    const { src, display } = mathStore[Number(i)];

    try {
      return katex.renderToString(src, {
        throwOnError: false,
        displayMode: display
      });
    } catch (e) {
      return `<span class="katex-err">${esc(src)}</span>`;
    }
  });

  // Возвращаем code
  html = html.replace(/@@CODE_(\d+)@@/g, (_, i) =>
    codeStore[Number(i)]
  );

  return html;
}

// Anchor: Monday 21.09.2026 is the Monday of a confirmed "чётная" (even) week.
const SCHED_ANCHOR_MONDAY=new Date(2026,8,21);
function mondayOf(date){
  const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());
  const day=d.getDay();
  d.setDate(d.getDate()+(day===0?-6:1-day));
  return d;
}
function weekParity(date){
  const mon=mondayOf(date);
  const weeksDiff=Math.round((mon-SCHED_ANCHOR_MONDAY)/(7*86400000));
  return (((weeksDiff%2)+2)%2)===0?'even':'odd';
}
function isVacation(date){const m=date.getMonth();return m===6||m===7;} // июль, август
function cycleDayIndex(date){
  const weekday=date.getDay()===0?7:date.getDay();
  const dayNum=weekParity(date)==='odd'?weekday:weekday+7;
  return dayNum-1;
}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function pluralPairs(n){
  const n10=n%10,n100=n%100;
  if(n10===1&&n100!==11)return'пара';
  if([2,3,4].includes(n10)&&![12,13,14].includes(n100))return'пары';
  return'пар';
}
function scheduleSummaryToday(){
  const d=new Date();
  if(isVacation(d))return'🏖️ Сейчас каникулы';
  const n=(SCHEDULE[cycleDayIndex(d)]||[]).filter(l=>!l.break).length;
  const parity=weekParity(d)==='even'?'чётная':'нечётная';
  return`Расписание на сегодня (${parity} неделя, ${n} ${pluralPairs(n)})`;
}
const WEEKDAYS_SHORT=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WEEKDAYS_FULL=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
function fmtDateRu(d){return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});}
let scheduleDate=new Date();

function renderSchedule(){
  const c=document.getElementById('content');
  c.innerHTML=scheduleHtml(scheduleDate);
  bindScheduleEvents();
}
function scheduleHtml(date){
  const vacation=isVacation(date);
  const weekdayIdx=date.getDay()===0?6:date.getDay()-1;
  const parity=weekParity(date);
  const mon=mondayOf(date);
  let pills='<div class="week-pills">';
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const isToday=sameDay(d,new Date()),isSel=sameDay(d,date);
    pills+=`<button class="week-pill${isSel?' sel':''}${isToday?' today':''}" data-date="${d.toISOString()}">${WEEKDAYS_SHORT[i]}<br>${d.getDate()}</button>`;
  }
  pills+='</div>';
  let body;
  if(vacation){
    body='<p class="state" style="padding:30px 0;text-align:center;">🏖️ Каникулы — занятий нет.</p>';
  }else{
    const lessons=SCHEDULE[cycleDayIndex(date)];
    if(!lessons||lessons.length===0){
      body='<p class="state" style="padding:30px 0;text-align:center;">В этот день занятий нет.</p>';
    }else{
      body='<div class="lessons">'+lessons.map(l=>{
        if(l.break)return`<div class="lesson lesson-break"><div class="lesson-time">${esc(l.time)}</div><div class="lesson-info"><div class="lesson-subject">☕ ${esc(l.subject)}</div></div></div>`;
        return`<div class="lesson"><div class="lesson-time">${esc(l.time)}</div><div class="lesson-info"><div class="lesson-subject">${esc(l.subject)}</div><div class="lesson-meta">ауд. ${esc(l.room)} · ${esc(l.teacher)}</div><div class="lesson-meta">${esc(l.location)}</div></div></div>`;
      }).join('')+'</div>';
    }
  }
  return`<div class="intro"><h1>Расписание</h1><p class="sub">М3102 · дни 1–7 нечётной недели, 8–14 чётной. Июль и август — каникулы.</p></div>
  <div class="sched-bar"><button class="btn2" id="sched-prev-week">← неделя</button>${pills}<button class="btn2" id="sched-next-week">неделя →</button></div>
  <div class="sched-day-info"><div class="sched-day-title">${WEEKDAYS_FULL[weekdayIdx]}, ${fmtDateRu(date)}</div><div class="sched-day-sub">${vacation?'Каникулы':(parity==='even'?'Чётная неделя':'Нечётная неделя')}</div></div>
  ${body}
  <div style="text-align:center;margin-top:18px;"><button class="btn2" id="sched-today">Сегодня</button></div>`;
}
function bindScheduleEvents(){
  document.querySelectorAll('.week-pill').forEach(btn=>btn.onclick=()=>{scheduleDate=new Date(btn.dataset.date);renderSchedule();});
  const prev=document.getElementById('sched-prev-week');if(prev)prev.onclick=()=>{const d=new Date(scheduleDate);d.setDate(d.getDate()-7);scheduleDate=d;renderSchedule();};
  const next=document.getElementById('sched-next-week');if(next)next.onclick=()=>{const d=new Date(scheduleDate);d.setDate(d.getDate()+7);scheduleDate=d;renderSchedule();};
  const today=document.getElementById('sched-today');if(today)today.onclick=()=>{scheduleDate=new Date();renderSchedule();};
}

/* ---------- home landing page ---------- */
const HOME_TILES=[
  {name:'Конспекты',icon:'📝',desc:'Конспекты лекций и практик по предметам'},
  {name:'Записи лекций',icon:'🎙️',desc:'Аудиозаписи лекций'},
  {name:'Лабораторные',icon:'🧪',desc:'Лабораторные работы и отчёты по ним'},
  {name:'Материалы',icon:'📚',desc:'Учебники и вспомогательные материалы'},
  {name:'Дедлайны',icon:'🗓️',desc:'Сроки сдачи и важные даты'}
];
function renderHome(){
  const c=document.getElementById('content');
  const tiles=HOME_TILES.map(t=>`<a class="card${t.name==='Дедлайны'?' deadline-card':''}" data-nav="${esc(t.name)}"><div class="ic">${t.icon}</div><div class="meta"><div class="name">${esc(t.name)}</div><div class="desc">${esc(t.desc)}</div></div></a>`).join('');
  c.innerHTML=`
  <div class="home-hero">
    <h1>Материалы группы М3102</h1>
    <p class="sub">Конспекты, записи лекций, лабораторные и учебники по дисциплинам первого курса ИТМО. Всё загружается прямо из GitHub-репозитория — PDF и .md конспекты открываются в браузере.</p>
    <div class="home-actions">
      <a class="btn2 btn-primary" id="enter-btn">Перейти к материалам →</a>
      <a class="btn2" id="enter-schedule">${scheduleSummaryToday()}</a>
    </div>
  </div>
  <div class="home-grid">
    <div class="home-main"><div class="grid">${tiles}</div></div>
    <aside class="home-side">
      <h2 class="side-title">Недавние конспекты</h2>
      <div id="recent-notes"><p class="state" style="padding:8px 0;">Загрузка…</p></div>
    </aside>
  </div>`;
  document.getElementById('enter-btn').onclick=e=>{e.preventDefault();location.hash='#/materials';};
  document.getElementById('enter-schedule').onclick=e=>{e.preventDefault();location.hash='#/schedule';};
  c.querySelectorAll('[data-nav]').forEach(el=>el.onclick=e=>{e.preventDefault();goto(el.dataset.nav);});
  fetchRecentNotes();
}
const RECENT_NOTES_LIMIT=6;
async function fetchRecentNotes(){
  const box=document.getElementById('recent-notes');
  if(!box)return;
  try{
    const res=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/commits?sha=${BRANCH}&per_page=10`);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const commits=await res.json();
    const seen=new Map();
    for(const cm of commits){
      if(seen.size>=RECENT_NOTES_LIMIT)break;
      try{
        const cr=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/commits/${cm.sha}`);
        if(!cr.ok)continue;
        const detail=await cr.json();
        const date=(cm.commit&&cm.commit.author&&cm.commit.author.date)||(detail.commit&&detail.commit.author&&detail.commit.author.date);
        (detail.files||[]).forEach(f=>{
          if(ext(f.filename)==='md'&&f.status!=='removed'&&!seen.has(f.filename))seen.set(f.filename,date);
        });
      }catch(e){/* пропускаем коммит при ошибке */}
    }
    const list=Array.from(seen.entries()).map(([path,date])=>({path,date})).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,RECENT_NOTES_LIMIT);
    if(list.length===0){box.innerHTML='<p class="state" style="padding:8px 0;">Пока нет добавленных конспектов.</p>';return;}
    box.innerHTML=list.map(item=>{
      const parts=item.path.split('/');
      const name=parts[parts.length-1].replace(/\.md$/i,'');
      let subject='Прочее';
      if(parts[0]==='Конспекты'&&parts.length>=2)subject=parts[1];
      else if(parts.length>=2)subject=parts[parts.length-2];
      const dateStr=new Date(item.date).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'});
      return`<a class="recent-item" data-note="${esc(item.path)}"><div class="recent-name">${esc(name)}</div><div class="recent-meta">${esc(subject)} · ${dateStr}</div></a>`;
    }).join('');
    box.querySelectorAll('[data-note]').forEach(el=>el.onclick=e=>{e.preventDefault();gotoNote(el.dataset.note);});
  }catch(e){
    box.innerHTML='<p class="state" style="padding:8px 0;">Не удалось загрузить список (превышен лимит запросов к GitHub API?).</p>';
  }
}

/* ---------- routing ---------- */
function parseHash(){
  let h=location.hash.replace(/^#\/?/,'');
  if(h==='')return{mode:'home',path:''};
  if(h==='materials')return{mode:'browse',path:''};
  if(h==='schedule')return{mode:'schedule',path:''};
  if(h.startsWith('view/'))return{mode:'view',path:decodePath(h.slice(5))};
  if(h.startsWith('note/'))return{mode:'note',path:decodePath(h.slice(5))};
  return{mode:'browse',path:decodePath(h)};
}
function updateActiveTab(mode,path){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  let id='tab-materials';
  if(mode==='home')id='tab-home';
  else if(mode==='schedule')id='tab-schedule';
  else if(mode==='browse'&&path&&path.split('/')[0]==='Дедлайны')id='tab-deadlines';
  const el=document.getElementById(id);
  if(el)el.classList.add('active');
}
function breadcrumbs(path){
  const parts=path?path.split('/'):[];
  let html='<div class="crumbs"><a data-p="">Материалы</a>';
  let acc='';
  parts.forEach(p=>{acc=acc?acc+'/'+p:p;html+=' / <a data-p="'+esc(acc)+'">'+esc(p)+'</a>';});
  return html+'</div>';
}
function viewBar(icon,name,path){
  return `<div class="viewbar"><button class="btn2" id="back-btn">← Назад</button><div class="viewname">${icon} ${esc(name)}</div><a class="btn2" href="${rawUrl(path)}" target="_blank" rel="noopener" download>Скачать</a></div>`;
}
function bindBack(path){document.getElementById('back-btn').onclick=()=>goto(path.split('/').slice(0,-1).join('/'));}

async function renderBrowse(path){
  const c=document.getElementById('content');
  let intro='';
  if(!path)intro='<div class="intro"><h1>Материалы группы М3102</h1><p class="sub">Конспекты, записи лекций, лабораторные и учебники по дисциплинам первого курса ИТМО. Выберите раздел, затем — предмет и нужный файл. PDF и конспекты .md открываются прямо в браузере.</p></div>';
  c.innerHTML=intro+breadcrumbs(path)+'<p class="state">Загрузка…</p>';
  try{
    const res=await fetch(apiUrl(path));
    if(!res.ok){
      const msg=res.status===403?'Превышен лимит запросов к GitHub API. Подождите немного и обновите страницу.':'Не удалось загрузить содержимое папки.';
      c.innerHTML=intro+breadcrumbs(path)+'<p class="state">'+msg+'</p>';return;
    }
    let items=await res.json();
    if(!Array.isArray(items))items=[items];
    items.sort((a,b)=>a.type!==b.type?(a.type==='dir'?-1:1):a.name.localeCompare(b.name,'ru'));
    let grid='<div class="grid">';
    items.forEach(it=>{
      if(it.type==='dir'){
        if(!path && it.name==='Дедлайны'){
          grid+=`<a class="card deadline-card" data-nav="${esc(it.path)}"><div class="ic">🗓️</div><div class="meta"><div class="name">Дедлайны</div><div class="desc">Сроки сдачи и важные даты</div></div></a>`;
          return;
        }
        const sub=path?'':(SUBTITLES[it.name]||'Папка');
        grid+=`<a class="card" data-nav="${esc(it.path)}"><div class="ic">📁</div><div class="meta"><div class="name">${esc(it.name)}</div><div class="desc">${esc(sub)}</div></div></a>`;
      }else{
        const e=ext(it.name), icon=EXT_ICON[e]||'📄';
        if(e==='pdf'){
          grid+=`<a class="card" data-view="${esc(it.path)}"><div class="ic">${icon}</div><div class="meta"><div class="name">${esc(it.name)}</div><div class="desc">${fmtSize(it.size)} · читать в браузере</div></div></a>`;
        }else if(e==='md'){
          grid+=`<a class="card" data-note="${esc(it.path)}"><div class="ic">${icon}</div><div class="meta"><div class="name">${esc(it.name)}</div><div class="desc">${fmtSize(it.size)} · читать конспект</div></div></a>`;
        }else if(it.name!="index.html"){
          grid+=`<div class="card" style="cursor:default;"><div class="ic">${icon}</div><div class="meta"><div class="name">${esc(it.name)}</div><div class="desc">${fmtSize(it.size)}</div></div><a class="btn" href="${rawUrl(it.path)}" target="_blank" rel="noopener">Скачать</a></div>`;
        }
      }
    });
    grid+='</div>';
    if(items.length===0)grid='<p class="state">Папка пуста.</p>';
    c.innerHTML=intro+breadcrumbs(path)+grid;
    c.querySelectorAll('[data-nav]').forEach(el=>el.onclick=e=>{e.preventDefault();goto(el.dataset.nav);});
    c.querySelectorAll('[data-view]').forEach(el=>el.onclick=e=>{e.preventDefault();gotoView(el.dataset.view);});
    c.querySelectorAll('[data-note]').forEach(el=>el.onclick=e=>{e.preventDefault();gotoNote(el.dataset.note);});
    c.querySelectorAll('.crumbs a').forEach(el=>el.onclick=e=>{e.preventDefault();goto(el.dataset.p);});
  }catch(e){
    c.innerHTML=intro+breadcrumbs(path)+'<p class="state">Ошибка загрузки: '+esc(e.message)+'</p>';
  }
}

function renderPdfView(path){
  const name=path.split('/').pop();
  const c=document.getElementById('content');
  c.innerHTML=viewBar('📕',name,path)+'<p class="state" id="pdf-status">Загрузка PDF…</p><div id="pdf-pages" style="max-width:900px;margin:0 auto;"></div>';
  bindBack(path);
  if(!window.__pdfWorkerSet){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';window.__pdfWorkerSet=true;}
  pdfjsLib.getDocument(rawUrl(path)).promise.then(pdf=>{
    const status=document.getElementById('pdf-status');if(status)status.remove();
    const container=document.getElementById('pdf-pages');
    for(let n=1;n<=pdf.numPages;n++){
      const canvas=document.createElement('canvas');
      canvas.className='pdf-page';
      container.appendChild(canvas);
      pdf.getPage(n).then(page=>{
        const cw=Math.min(container.clientWidth||860,900);
        const vp0=page.getViewport({scale:1});
        const viewport=page.getViewport({scale:cw/vp0.width});
        canvas.width=viewport.width;canvas.height=viewport.height;
        page.render({canvasContext:canvas.getContext('2d'),viewport});
      });
    }
  }).catch(err=>{
    const status=document.getElementById('pdf-status');
    if(status)status.textContent='Не удалось загрузить PDF ('+err.message+'). Попробуйте скачать файл напрямую.';
  });
}

function renderNoteView(path){
  const name=path.split('/').pop();
  const c=document.getElementById('content');
  c.innerHTML=viewBar('📝',name,path)+'<p class="state" id="note-status">Загрузка…</p><div class="prose" id="note-body"></div>';
  bindBack(path);
  fetch(rawUrl(path)).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(text=>{const s=document.getElementById('note-status');if(s)s.remove();document.getElementById('note-body').innerHTML=renderNotes(text);})
    .catch(err=>{const s=document.getElementById('note-status');if(s)s.textContent='Не удалось загрузить файл ('+err.message+').';});
}

function route(){
  const {mode,path}=parseHash();
  updateActiveTab(mode,path);
  if(mode==='view')renderPdfView(path);
  else if(mode==='note')renderNoteView(path);
  else if(mode==='home')renderHome();
  else if(mode==='schedule')renderSchedule();
  else renderBrowse(path);
}
window.addEventListener('hashchange',route);
route();
</script>
