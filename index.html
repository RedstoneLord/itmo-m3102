<style>
:root{--bg:#f4f5fa;--card:#ffffff;--text:#1a1c24;--muted:#6b7280;--border:#e6e7ee;--accent:#5b5fef;--accent2:#7c7ffb;--radius:16px;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1016;--card:#1a1c26;--text:#eef0f7;--muted:#9599ab;--border:#2b2e3c;}}
:root[data-theme="dark"]{--bg:#0f1016;--card:#1a1c26;--text:#eef0f7;--muted:#9599ab;--border:#2b2e3c;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.wrap{max-width:960px;margin:0 auto;padding:22px 18px 60px;}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.brand{font-weight:700;font-size:1.05rem;text-decoration:none;color:var(--text);cursor:pointer;}
.navlinks{display:flex;gap:14px;}
.navlinks a{color:var(--muted);font-size:.82rem;text-decoration:none;}
.navlinks a:hover{color:var(--accent);}
.deadline-card{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--card));}
.deadline-card:hover{border-color:var(--accent2);}
.intro{margin:14px 0 6px;}
h1{font-size:1.7rem;margin:0 0 6px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{color:var(--muted);font-size:.95rem;max-width:600px;margin:0 0 18px;}
.crumbs{font-size:.85rem;color:var(--muted);margin:10px 0 16px;}
.crumbs a{color:var(--muted);text-decoration:none;cursor:pointer;}
.crumbs a:hover{color:var(--accent);}
.grid{display:grid;gap:14px;grid-template-columns:1fr;}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr;}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none;color:var(--text);}
.card:hover{border-color:var(--accent);}
.card .ic{font-size:1.6rem;line-height:1;}
.card .meta{min-width:0;flex:1;}
.card .name{font-weight:600;font-size:.95rem;word-break:break-word;}
.card .desc{color:var(--muted);font-size:.78rem;margin-top:2px;}
.card .btn{border:1px solid var(--border);background:var(--bg);padding:6px 12px;border-radius:8px;font-size:.78rem;white-space:nowrap;text-decoration:none;color:var(--text);}
.card .btn:hover{border-color:var(--accent);}
.state{color:var(--muted);font-size:.9rem;padding:20px 0;}
.viewbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.btn2{border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 14px;border-radius:10px;font-size:.85rem;cursor:pointer;text-decoration:none;}
.btn2:hover{border-color:var(--accent);}
.viewname{font-weight:600;flex:1;min-width:0;word-break:break-word;}
.pdf-page{display:block;margin:0 auto 14px;max-width:100%;height:auto;box-shadow:0 2px 14px rgba(0,0,0,.18);border-radius:4px;}
footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:30px;}
.prose{max-width:760px;margin:0 auto;line-height:1.7;font-size:.98rem;}
.prose h1,.prose h2,.prose h3{line-height:1.3;margin:1.3em 0 .5em;}
.prose h1{font-size:1.5rem;}.prose h2{font-size:1.25rem;}.prose h3{font-size:1.08rem;}
.prose p{margin:.7em 0;}
.prose ul,.prose ol{padding-left:1.4em;margin:.6em 0;}
.prose blockquote{border-left:3px solid var(--border);margin:.8em 0;padding:.2em 1em;color:var(--muted);}
.prose table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.9rem;display:block;overflow-x:auto;}
.prose th,.prose td{border:1px solid var(--border);padding:6px 10px;text-align:left;}
.prose img{max-width:100%;border-radius:8px;}
.prose pre{position:relative;background:#1e1f29;border-radius:10px;padding:14px;overflow-x:auto;margin:1em 0;}
.prose code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.85em;}
.prose :not(pre)>code{background:var(--border);padding:1px 5px;border-radius:5px;}
.prose .code-copy{position:absolute;top:8px;right:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#d7d9e2;font-size:.72rem;padding:4px 9px;border-radius:6px;cursor:pointer;opacity:0;transition:opacity .15s;}
.prose pre:hover .code-copy{opacity:1;}
.prose .code-copy.copied{opacity:1;border-color:#22c55e;color:#22c55e;}
.prose .mermaid{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin:1em 0;overflow-x:auto;text-align:center;}
.prose .mermaid-err{color:#e0485c;font-family:monospace;font-size:.85em;white-space:pre-wrap;background:rgba(224,72,92,.08);border-radius:8px;padding:10px 12px;}
.prose h1[id],.prose h2[id],.prose h3[id]{scroll-margin-top:14px;}
.prose .heading-anchor{opacity:0;margin-left:.35em;color:var(--muted);text-decoration:none;font-size:.85em;}
.prose h1:hover .heading-anchor,.prose h2:hover .heading-anchor,.prose h3:hover .heading-anchor{opacity:1;}
.prose .img-figure{margin:1em 0;text-align:center;}
.prose .img-figure img{cursor:zoom-in;}
.prose .img-figure figcaption{color:var(--muted);font-size:.82rem;margin-top:6px;}
.img-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:24px;z-index:1000;cursor:zoom-out;}
.img-lightbox img{max-width:100%;max-height:100%;border-radius:6px;}
.prose .katex-display{overflow-x:auto;overflow-y:hidden;padding:.3em 0;}
.prose .katex-err{color:#e0485c;font-family:monospace;}
.prose hr{border:none;border-top:1px solid var(--border);margin:1.5em 0;}
.callout{border-left:4px solid var(--c-color);background:var(--c-bg);border-radius:10px;padding:12px 16px;margin:14px 0;}
.callout-title{font-weight:700;font-size:.76rem;margin-bottom:6px;color:var(--c-color);text-transform:uppercase;letter-spacing:.03em;}
.callout-body{font-size:.93rem;}
.callout-body>:first-child{margin-top:0;}
.callout-body>:last-child{margin-bottom:0;}

/* header tabs */
.tabs{display:flex;gap:2px;flex-wrap:wrap;}
.tab{padding:7px 12px;border-radius:10px;font-size:.83rem;color:var(--muted);text-decoration:none;cursor:pointer;white-space:nowrap;}
.tab:hover{color:var(--text);background:var(--border);}

/* home landing page */
.home-hero{padding:6px 0 4px;}
.home-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;}
.home-actions .btn2{padding:14px 22px;font-size:1rem;border-radius:12px;}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2);}
.home-grid{display:grid;gap:20px;grid-template-columns:1fr;margin-top:24px;align-items:start;}
@media(min-width:760px){.home-grid{grid-template-columns:1fr 300px;}}
.home-side{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.side-title{font-size:.95rem;margin:0 0 12px;}
.recent-item{display:block;padding:10px 0;border-bottom:1px solid var(--border);text-decoration:none;color:var(--text);}
.recent-item:last-child{border-bottom:none;}
.recent-item:hover .recent-name{color:var(--accent);}
.recent-name{font-weight:600;font-size:.88rem;word-break:break-word;}
.recent-meta{color:var(--muted);font-size:.76rem;margin-top:2px;}

/* schedule */
.sched-bar{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 8px;}
.week-pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.week-pill{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:6px 10px;font-size:.78rem;cursor:pointer;text-align:center;line-height:1.3;}
.week-pill.today{border-color:var(--accent);}
.week-pill.sel{background:var(--accent);color:#fff;border-color:var(--accent);}
.sched-day-info{text-align:center;margin:14px 0 20px;}
.sched-day-title{font-weight:700;font-size:1.05rem;}
.sched-day-sub{color:var(--muted);font-size:.85rem;margin-top:2px;}
.lessons{display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto;}
.lesson{display:flex;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;}
.lesson-time{font-weight:700;font-size:.85rem;color:var(--accent);min-width:92px;}
.lesson-subject{font-weight:600;font-size:.92rem;}
.lesson-meta{color:var(--muted);font-size:.78rem;margin-top:2px;}
.lesson-break{opacity:.65;}
.print-logo{display:none;}
 @media print{

  :root{--bg:#fff;--card:#fff;--text:#111;--muted:#555;--border:#ccc;}

    background-repeat:repeat;
  }
  .prose pre{background:#f2f2f2 !important;color:#111 !important;border:1px solid #ddd;}
  .prose .mermaid{background:#fff !important;}

  .prose img{max-width:100% !important;}

  .print-logo{

<script type="module">
import { dateKey, parseDate, isVacation, lessonsOn, weekParity } from './js/schedule.js';
import { mountSchedule, ensureSchedule, getSchedule } from './js/schedule-ui.js';
import { installScheduleEditor } from './js/schedule-editor.js';
import { githubFetch } from './js/github.js';
import { installHomework, renderHomeHomework, renderHomeworkPage } from './js/homework.js';
import { hasDiagram, codeFigure } from './js/diagrams/index.js';
import { bindNoteDiagrams, installDiagramEditor, renderDiagramEditor } from './js/diagrams/editor.js';
import { installMemes, renderMemesPage } from './js/memes.js';
const OWNER='RedstoneLord', REPO='itmo-m3102', BRANCH='master';
const SUBTITLES={
  'Записи лекций':'Аудиозаписи лекций',
  'Конспекты':'Конспекты лекций и практик по предметам',
  'Лабораторные':'Лабораторные работы и отчёты по ним',
  'Материалы':'Учебники и вспомогательные материалы'
};
const EXT_ICON={pdf:'PDF',docx:'DOC',doc:'DOC',md:'MD',html:'WEB',htm:'WEB',mp3:'MP3',wav:'WAV',djvu:'DJVU',txt:'TXT'};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
// Файлы и папки, которые не должны отображаться при просмотре материалов
const HIDDEN_FILE_NAMES=['site.css','package.json','readme.md','.gitignore'];
const HIDDEN_FOLDER_NAMES=['tests','inner','data','js','css','docs','img'];
function isHiddenPath(path){
  if(!path)return false;
  const parts=path.split('/');
  const base=parts[parts.length-1];
  if(HIDDEN_FILE_NAMES.includes(base.toLowerCase()))return true;
  return parts.some(p=>HIDDEN_FOLDER_NAMES.includes(p.toLowerCase()));
}
function ext(name){const i=name.lastIndexOf('.');return i<0?'':name.slice(i+1).toLowerCase();}
function fmtSize(b){if(b<1024)return b+' Б';if(b<1048576)return (b/1024).toFixed(0)+' КБ';return (b/1048576).toFixed(1)+' МБ';}
function encodePath(p){return p?p.split('/').map(encodeURIComponent).join('/'):'';}
function decodePath(p){return p?p.split('/').map(decodeURIComponent).join('/'):'';}
function apiUrl(path){const p=encodePath(path);return `https://api.github.com/repos/${OWNER}/${REPO}/contents${p?'/'+p:''}?ref=${BRANCH}`;}
function rawUrl(path){return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${encodePath(path)}`;}
function goto(path){location.hash=path?'#/'+encodePath(path):'#/materials';}
function gotoView(path){location.hash='#/view/'+encodePath(path);}
function gotoNote(path){location.hash='#/note/'+encodePath(path);}
function gotoHomePage(){if(location.hash===''||location.hash==='#')route();else location.hash='';}
document.getElementById('home-link').onclick=e=>{e.preventDefault();gotoHomePage();};
document.getElementById('tab-home').onclick=e=>{e.preventDefault();gotoHomePage();};
document.getElementById('tab-materials').onclick=e=>{e.preventDefault();location.hash='#/materials';};
document.getElementById('tab-schedule').onclick=e=>{e.preventDefault();location.hash='#/schedule';};

/* ---------- notes parser (markdown + callouts + code + LaTeX) ---------- */
const CALLOUT_TYPES={
  remember:{color:'#e0485c',bg:'rgba(224,72,92,.08)',icon:'🔴',label:'Запомнить'},
  note:{color:'#dd9a2b',bg:'rgba(221,154,43,.08)',icon:'🟡',label:'Заметка'},
  meaning:{color:'#3b82f6',bg:'rgba(59,130,246,.08)',icon:'🔵',label:'Определение'},
  warning:{color:'#f97316',bg:'rgba(249,115,22,.08)',icon:'🟠',label:'Важно'},
  example:{color:'#22c55e',bg:'rgba(34,197,94,.08)',icon:'🟢',label:'Пример'},
  formula:{color:'#a855f7',bg:'rgba(168,85,247,.08)',icon:'🟣',label:'Формула'}
};
const CALLOUT_ALIASES={remember:'remember',запомнить:'remember',note:'note',заметка:'note',meaning:'meaning',определение:'meaning',warning:'warning',важно:'warning',внимание:'warning',example:'example',пример:'example',formula:'formula',формула:'formula'};
function resolveCalloutType(raw){return CALLOUT_ALIASES[String(raw).toLowerCase()]||'note';}

const calloutExtension={
  name:'callout', level:'block',
  start(src){const m=/(^|\n):::\S+/.exec(src);return m?m.index+(m[1]?1:0):undefined;},
  tokenizer(src){
    const rule=/^:::(\S+)[ \t]*\n([\s\S]*?)\n:::[ \t]*(?:\n|$)/;
    const m=rule.exec(src);
    if(m){
      const token={type:'callout',raw:m[0],calloutType:m[1],text:m[2],tokens:[]};
      this.lexer.blockTokens(token.text,token.tokens);
      return token;
    }
  },
  renderer(token){
    const type=resolveCalloutType(token.calloutType), cfg=CALLOUT_TYPES[type];
    return `<div class="callout" style="--c-color:${cfg.color};--c-bg:${cfg.bg};"><div class="callout-title">${cfg.icon} ${cfg.label}</div><div class="callout-body">${this.parser.parse(token.tokens)}</div></div>\n`;
  }
};
// ---- вспомогательные функции: подсветка кода, диаграммы, изображения ----
let mermaidSeq=0;
function renderMermaidBlock(code){
  const id='mermaid-'+(++mermaidSeq);
  // сам рендеринг SVG выполняется асинхронно после вставки в DOM (см. runMermaid)
  return `<div class="mermaid" data-mermaid-id="${id}">${esc(code)}</div>`;
}
function highlightCode(code,lang){
  let out;
  try{out=(lang&&hljs.getLanguage(lang))?hljs.highlight(code,{language:lang}).value:hljs.highlightAuto(code).value;}
  catch(e){out=esc(code);}
  const langAttr=lang?` data-lang="${esc(lang)}"`:'';
  return `<pre><button class="code-copy" type="button" data-copy>Копировать</button><code class="hljs"${langAttr}>${out}</code></pre>`;
}
function renderCodeBlock(code,infostring){
  const lang=(infostring||'').trim().split(/\s+/)[0].toLowerCase();
  if(lang==='mermaid')return renderMermaidBlock(code);
  if(hasDiagram(lang))return codeFigure(lang,code);
  return highlightCode(code,lang);
}

// Разрешаем относительные пути картинок/ссылок внутри конспекта относительно его расположения в репозитории
let notesBasePath='';
function resolveNotePath(url,basePath){
  if(!url)return url;
  if(/^[a-z][a-z0-9+.-]*:/i.test(url)||url.startsWith('//')||url.startsWith('#'))return null;
  const dir=basePath.includes('/')?basePath.slice(0,basePath.lastIndexOf('/')):'';
  const combined=(dir?dir+'/':'')+url;
  const parts=[];
  combined.split('/').forEach(seg=>{
    if(seg==='..')parts.pop();
    else if(seg!=='.'&&seg!=='')parts.push(seg);
  });
  return decodeURIComponent(parts.join('/'));
}

marked.use({
  gfm:true, breaks:false,
  extensions:[calloutExtension],
  renderer:{
    code(code,infostring){
      return renderCodeBlock(code,infostring);
    },
    heading(text,level,raw){
      const slug=String(raw||text).toLowerCase().trim()
        .replace(/[^\p{L}\p{N}\s-]/gu,'').replace(/\s+/g,'-');
      return `<h${level} id="${esc(slug)}">${text}<a class="heading-anchor" href="#${esc(slug)}" aria-hidden="true">#</a></h${level}>\n`;
    },
    html(html){return esc(html);},
    image(href,title,text){
      const resolved=resolveNotePath(href,notesBasePath);
      const src=resolved?rawUrl(resolved):/^https?:\/\//i.test(href)?href:'';
      if(!src)return esc(text||'');
      const cap=title||text;
      return `<figure class="img-figure"><img src="${esc(src)}" alt="${esc(text||'')}" loading="lazy" data-lightbox="${esc(src)}">${cap?`<figcaption>${esc(cap)}</figcaption>`:''}</figure>`;
    },
    link(href,title,text){
      const resolved=resolveNotePath(href,notesBasePath);
      if(resolved){
        if(/\.md$/i.test(resolved))return `<a href="#/note/${encodePath(resolved)}" title="${esc(title||'')}">${text}</a>`;
        return `<a href="${esc(rawUrl(resolved))}" target="_blank" rel="noopener" title="${esc(title||'')}">${text}</a>`;
      }
      if(!/^https?:\/\//i.test(href))return text;
      return `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="${esc(title||'')}">${text}</a>`;
    }
  }
});

function renderNotes(raw, basePath) {
  notesBasePath = basePath || '';
  const codeStore = [];

  // Сначала защищаем fenced code (поддержаны ``` и ~~~, с указанием языка)
  let text = raw.replace(/^([ \t]*)(`{3,}|~{3,})([^\n`~]*)\n([\s\S]*?)\n\1\2[ \t]*$/gm, (m, indent, fence, info, code) => {
    codeStore.push(renderCodeBlock(code, info));
    return `@@CODE_${codeStore.length - 1}@@`;
  });

  const mathStore = [];

  function stash(src, display) {
    mathStore.push({ src, display });
    return `@@MATH_${mathStore.length - 1}@@`;
  }

  // Защищаем математику от Markdown-парсера
  text = text.replace(/\$\$([\s\S]+?)\$\$/g, (_, g) =>
    stash(g.trim(), true)
  );

  text = text.replace(/\\\[([\s\S]+?)\\\]/g, (_, g) =>
    stash(g.trim(), true)
  );

  text = text.replace(/\\\(([\s\S]+?)\\\)/g, (_, g) =>
    stash(g.trim(), false)
  );

  text = text.replace(/\$([^\$\n]+?)\$/g, (_, g) =>
    stash(g.trim(), false)
  );

  // Теперь Markdown
  let html = marked.parse(text);

  // Возвращаем формулы
  html = html.replace(/@@MATH_(\d+)@@/g, (_, i) => {
    const { src, display } = mathStore[Number(i)];

    try {
      return katex.renderToString(src, {
        throwOnError: false,
        displayMode: display
      });
    } catch (e) {
      return `<span class="katex-err">${esc(src)}</span>`;
    }
  });

  // Возвращаем code/диаграммы (снимаем обёртку <p>, которую мог добавить marked)
  html = html.replace(/<p>@@CODE_(\d+)@@<\/p>/g, (_, i) => codeStore[Number(i)]);
  html = html.replace(/@@CODE_(\d+)@@/g, (_, i) => codeStore[Number(i)]);

  return html;
}

// Запускает отрисовку Mermaid-диаграмм и навешивает обработчики (копирование кода, лайтбокс картинок)
let mermaidReady=false;
function initMermaidOnce(){
  if(mermaidReady||typeof mermaid==='undefined')return;
  const dark=document.documentElement.getAttribute('data-theme')==='dark'||
    (document.documentElement.getAttribute('data-theme')!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:dark?'dark':'default'});
  mermaidReady=true;
}
async function runNoteExtras(container){
  if(!container)return;
  bindNoteDiagrams(container);
  // диаграммы
  const nodes=container.querySelectorAll('.mermaid[data-mermaid-id]');
  if(nodes.length){
    initMermaidOnce();
    for(const node of nodes){
      const src=node.textContent;
      try{
        const {svg}=await mermaid.render(node.dataset.mermaidId+'-svg',src);
        node.innerHTML=svg;
      }catch(e){
        node.outerHTML=`<div class="mermaid-err">Не удалось построить диаграмму: ${esc(e.message||String(e))}</div>`;
      }
    }
  }
  // копирование кода
  container.querySelectorAll('[data-copy]').forEach(btn=>{
    btn.onclick=()=>{
      const code=btn.parentElement.querySelector('code');
      if(!code)return;
      navigator.clipboard.writeText(code.textContent).then(()=>{
        btn.textContent='Скопировано';btn.classList.add('copied');
        setTimeout(()=>{btn.textContent='Копировать';btn.classList.remove('copied');},1500);
      }).catch(()=>{});
    };
  });
  // лайтбокс для картинок конспекта
  container.querySelectorAll('img[data-lightbox]').forEach(img=>{
    img.onclick=()=>{
      const box=document.createElement('div');
      box.className='img-lightbox';
      box.innerHTML=`<img src="${esc(img.dataset.lightbox)}" alt="">`;
      box.onclick=()=>box.remove();
      document.body.appendChild(box);
    };
  });
}

function deadlineStatus(iso){

}

function renderDeadlines(items){
  const box=document.getElementById('home-deadlines');if(!box)return;
  const sorted=[...items].filter(x=>x&&x.id&&x.name&&Number.isFinite(new Date(x.deadline).getTime())).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));
  const visible=sorted.filter(x=>!plan.done['deadline:'+x.id]).slice(0,3);
  box.innerHTML=visible.length?visible.map(d=>`<label class="deadline-row"><input type="checkbox" data-deadline="${esc(d.id)}" aria-label="Отметить ${esc(d.name)} выполненным"><span class="deadline-day">${deadlineDate(d.deadline)}</span><span class="deadline-detail"><strong>${esc(d.name)}</strong><small>${esc(d.note||'Общий дедлайн')}</small></span><span class="deadline-status">${deadlineStatus(d.deadline)}</span></label>`).join(''):'<p class="empty-line">Все ближайшие дедлайны отмечены как выполненные.</p>';

const RECENT_NOTES_LIMIT=6;
async function fetchRecentNotes(){
  const box=document.getElementById('recent-notes');
  if(!box)return;
  try{
    const res=await githubFetch(`https://api.github.com/repos/${OWNER}/${REPO}/commits?sha=${BRANCH}&path=${encodeURIComponent('Конспекты')}&per_page=10`);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const commits=await res.json();
    const seen=new Map();
    for(const cm of commits){
      if(seen.size>=RECENT_NOTES_LIMIT)break;
      try{
        const cr=await githubFetch(`https://api.github.com/repos/${OWNER}/${REPO}/commits/${cm.sha}`);
        if(!cr.ok)continue;
        const detail=await cr.json();
        const date=(cm.commit&&cm.commit.author&&cm.commit.author.date)||(detail.commit&&detail.commit.author&&detail.commit.author.date);
        (detail.files||[]).forEach(f=>{
          if(ext(f.filename)==='md'&&f.status!=='removed'&&!seen.has(f.filename)&&!isHiddenPath(f.filename))seen.set(f.filename,date);
        });
      }catch(e){/* пропускаем коммит при ошибке */}
    }
    const list=Array.from(seen.entries()).map(([path,date])=>({path,date})).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,RECENT_NOTES_LIMIT);
    if(list.length===0){box.innerHTML='<p class="state" style="padding:8px 0;">Пока нет добавленных конспектов.</p>';return;}
    box.innerHTML=list.map(item=>{
      const parts=item.path.split('/');
      const name=parts[parts.length-1].replace(/\.md$/i,'');
      let subject='Прочее';
      if(parts[0]==='Конспекты'&&parts.length>=2)subject=parts[1];
      else if(parts.length>=2)subject=parts[parts.length-2];
      const dateStr=new Date(item.date).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'});
      return`<a class="recent-item" data-note="${esc(item.path)}"><div class="recent-name">${esc(name)}</div><div class="recent-meta">${esc(subject)} · ${dateStr}</div></a>`;
    }).join('');
    box.querySelectorAll('[data-note]').forEach(el=>el.onclick=e=>{e.preventDefault();gotoNote(el.dataset.note);});
  }catch(e){
    box.innerHTML='<p class="state" style="padding:8px 0;">Не удалось загрузить список (превышен лимит запросов к GitHub API?).</p>';
  }
}

/* ---------- routing ---------- */
function parseHash(){
  let h=location.hash.replace(/^#\/?/,'');
  if(h==='')return{mode:'home',path:''};
  if(h==='materials')return{mode:'browse',path:''};
  if(h==='schedule')return{mode:'schedule',path:''};
  if(h==='homework')return{mode:'homework',path:''};
  if(h==='diagrams'||h.startsWith('diagrams?'))return{mode:'diagrams',path:''};
  if(h==='memes')return{mode:'memes',path:''};
  if(/^schedule\/\d{4}-\d{2}-\d{2}$/.test(h))return{mode:'schedule',path:h.slice(9)};
  if(h.startsWith('view/'))return{mode:'view',path:decodePath(h.slice(5))};
  if(h.startsWith('note/'))return{mode:'note',path:decodePath(h.slice(5))};
  return{mode:'browse',path:decodePath(h)};
}
function updateActiveTab(mode,path){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  let id='tab-materials';
  if(mode==='home')id='tab-home';
  else if(mode==='schedule')id='tab-schedule';
  else if(mode==='homework')id='tab-homework';
  else if(mode==='diagrams')id='tab-diagrams';
  else if(mode==='memes')id='tab-memes';
  else if(mode==='browse'&&path&&path.split('/')[0]==='Дедлайны')id='tab-deadlines';
  const el=document.getElementById(id);
  if(el)el.classList.add('active');
}
function breadcrumbs(path){
  const parts=path?path.split('/'):[];
  let html='<div class="crumbs"><a data-p="">Материалы</a>';
  let acc='';
  parts.forEach(p=>{acc=acc?acc+'/'+p:p;html+=' / <a data-p="'+esc(acc)+'">'+esc(p)+'</a>';});
  return html+'</div>';
}
function viewBar(icon,name,path,extra=''){

function renderPdfView(path){
  const name=path.split('/').pop();
  const c=document.getElementById('content');
  c.innerHTML=viewBar('PDF',name,path)+'<p class="state" id="pdf-status">Загрузка PDF…</p><div id="pdf-pages" style="max-width:900px;margin:0 auto;"></div>';
  bindBack(path);
  if(!window.__pdfWorkerSet){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';window.__pdfWorkerSet=true;}
  pdfjsLib.getDocument(rawUrl(path)).promise.then(pdf=>{
    const status=document.getElementById('pdf-status');if(status)status.remove();
    const container=document.getElementById('pdf-pages');
    for(let n=1;n<=pdf.numPages;n++){
      const canvas=document.createElement('canvas');
      canvas.className='pdf-page';
      container.appendChild(canvas);
      pdf.getPage(n).then(page=>{
        const cw=Math.min(container.clientWidth||860,900);
        const vp0=page.getViewport({scale:1});
        const viewport=page.getViewport({scale:cw/vp0.width});
        canvas.width=viewport.width;canvas.height=viewport.height;
        page.render({canvasContext:canvas.getContext('2d'),viewport});
      });
    }
  }).catch(err=>{
    const status=document.getElementById('pdf-status');
    if(status)status.textContent='Не удалось загрузить PDF ('+err.message+'). Попробуйте скачать файл напрямую.';
  });
}

  const name=path.split('/').pop();
  const c=document.getElementById('content');
  c.innerHTML=viewBar('MD',name,path,'<button class="btn2" id="note-print-btn" type="button">🖨 Печать / PDF</button>')+'<p class="state" id="note-status">Загрузка…</p><div class="prose" id="note-body"></div>';
  bindBack(path);
  document.getElementById('note-print-btn').onclick=()=>{
    document.title=`${name.replace(/\.md$/i,'')} — М3102`;
    window.print();
  };
  fetch(rawUrl(path)).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(text=>{
      const s=document.getElementById('note-status');if(s)s.remove();
      const body=document.getElementById('note-body');
      body.innerHTML=renderNotes(text,path);
      runNoteExtras(body);
    })
    .catch(err=>{const s=document.getElementById('note-status');if(s)s.textContent='Не удалось загрузить файл ('+err.message+').';});
}

function route(){
  const {mode,path}=parseHash();
  updateActiveTab(mode,path);
  if(mode==='view')renderPdfView(path);
  else if(mode==='note')renderNoteView(path);
  else if(mode==='home')renderHome();
  else if(mode==='schedule')mountSchedule(parseDate(path)||new Date());
  else if(mode==='homework')renderHomeworkPage();
  else if(mode==='diagrams')renderDiagramEditor();
  else if(mode==='memes')renderMemesPage();
  else renderBrowse(path);
}
window.addEventListener('hashchange',route);
installScheduleEditor();
installHomework();
installDiagramEditor();
installMemes();
route();
</script>
</body>
</html>
